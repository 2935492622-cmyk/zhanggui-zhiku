[pytest]
# 为什么单独建这个文件：
#   pyproject.toml 是 git 已跟踪文件，Windows 侧改不动（Permission denied），
#   而 pytest 的配置放 ini 里一样生效，且不需要动 pyproject。
#   pythonpath = . 保证 `import app.xxx` 在任何目录下跑 pytest 都能找到包。
pythonpath = .
testpaths = tests

# 让 -v 输出里的中文正常显示，且失败时显示完整 diff
addopts = -ra --strict-markers

markers =
    integration: 使用真实解析库/本地文件进行集成验证
    mock: 使用替身注入解析结果或外部故障的单元测试
